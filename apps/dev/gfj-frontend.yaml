apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gfj-frontend-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: gfj-frontend=chankyswami/gfj-frontend

    argocd-image-updater.argoproj.io/gfj-frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/gfj-frontend.allow-tags: regexp:^git-.*

    argocd-image-updater.argoproj.io/gfj-frontend.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/gfj-frontend.helm.image-tag: image.tag

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

spec:
  project: dev

  source:
    repoURL: https://github.com/chankyswami/gfj-frontend-deployment.git
    targetRevision: main
    path: helm/gfj-frontend
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://172.16.16.100:6443
    namespace: gfj-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true



