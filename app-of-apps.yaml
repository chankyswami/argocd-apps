apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/chankyswami/argocd-apps.git
    targetRevision: main
    path: apps
    directory:
      recurse: true

  destination:
    server: https://172.16.16.100:6443
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true